name: Cardputer and OpenClaw bridge
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:security
      - run: npm run gate:security
      - run: npm run test:models
      - run: npm run test:install
      - run: npm run check:package
      - run: npm run test:boundaries
      - run: node --test src/streaming-upload.test.mjs
      - run: node --test src/turn-outbox.test.mjs
      - run: npm run test:upstream
      - run: npm run smoke
      - run: npm run smoke:mininerva
      - run: npm run smoke:realtime-contract
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install platformio==6.1.19
      - run: g++ -std=c++17 -Wall -Wextra -pedantic bots/CardputerADV/tests/transport_security_test.cpp -o /tmp/transport-security-test && /tmp/transport-security-test
      - run: python bots/CardputerADV/scripts/ui_feature_smoke.py
      - run: python bots/CardputerADV/scripts/release_delivery_smoke.py
      - run: g++ -std=c++17 -Wall -Wextra -pedantic bots/CardputerADV/tests/release_delivery_test.cpp -o /tmp/release-delivery-test && /tmp/release-delivery-test
      - run: node bots/CardputerADV/tests/render_eye_skins.mjs /tmp/cardputer-eye-skins
      - run: python scripts/test_assistant_ui.py
      - run: python scripts/test_unified_home.py
      - run: python scripts/test_home_update.py
      - run: python scripts/test_auto_ota.py
      - run: python scripts/test_ui_surface.py
      - run: python scripts/test_home_battery.py
      - run: python scripts/test_home_clock.py
      - run: python scripts/test_keyrush_layout.py
      - run: python scripts/test_realtime_screen.py
      - run: python scripts/test_realtime_connection.py
      - run: python scripts/test_realtime_audio_buffer.py
      - run: python scripts/test_realtime_scheduler.py
      - run: python scripts/test_network_recovery.py
      - run: python scripts/test_voice_reply_connection.py
      - run: python scripts/test_wifi_memory_budget.py
      - run: python scripts/test_voice_delivery.py
      - run: python scripts/test_voice_capture.py
      - run: python scripts/test_capture_upload.py
      - run: python scripts/test_capture_spool.py
      - run: python scripts/test_voice_usb_logging.py
      - run: python scripts/test_voice_transport.py
      - run: python scripts/test_voice_connect_failure.py
      - run: python scripts/test_voice_flow.py
      - run: python scripts/test_chat_voice_hint.py
      - run: python scripts/test_background_http.py
      - run: python scripts/test_ota_capacity.py
      - run: python scripts/test_canvas_reservation.py
      - run: python scripts/test_voice_receipt.py
      - run: python scripts/test_inbox_receipts.py
      - run: python scripts/test_voice_storage.py
      - run: python scripts/test_voice_reply_storage.py
      - run: python bots/CardputerADV/scripts/realtime_ui_smoke.py
      - run: python bots/CardputerADV/scripts/realtime_state_smoke.py
      - run: python scripts/test_nes.py
      - run: python scripts/test_nes_ui.py
      - run: python scripts/cardputer.py build
      - run: python scripts/test_realtime_frame_gate.py --require-upstream
