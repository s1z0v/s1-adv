name: Cardputer and OpenClaw bridge
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:security
      - run: npm run test:boundaries
      - run: npm run test:upstream
      - run: npm run smoke
      - run: npm run smoke:realtime-contract
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install platformio==6.1.19
      - run: g++ -std=c++17 -Wall -Wextra -pedantic bots/CardputerADV/tests/transport_security_test.cpp -o /tmp/transport-security-test && /tmp/transport-security-test
      - run: python bots/CardputerADV/scripts/ui_feature_smoke.py
      - run: python bots/CardputerADV/scripts/release_delivery_smoke.py
      - run: node bots/CardputerADV/tests/render_eye_skins.mjs /tmp/cardputer-eye-skins
      - run: python scripts/test_assistant_ui.py
      - run: python bots/CardputerADV/scripts/realtime_ui_smoke.py
      - run: python bots/CardputerADV/scripts/realtime_state_smoke.py
      - run: python scripts/test_nes.py
      - run: python scripts/cardputer.py build
